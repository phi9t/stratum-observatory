name: STRATUM verified publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stratum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Install test browser
        run: uv run --frozen playwright install --with-deps chromium
      - run: npm run verify:engineering
      - name: Retain exact tested artifact and receipt
        uses: actions/upload-artifact@v4
        with:
          name: engineering
          path: |
            dist/index.html
            verification/reports/
            tests/browser-results.json
  aesthetics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: npm run build
      # Measured legibility, layout composition and visual drift. Currently reports real
      # WCAG AA failures in the paper theme, so this job is expected to be red until the
      # tokens are remediated. Fix the tokens; never soften the gate or the policy.
      - run: npm run verify:aesthetics
      - name: Preserve the aesthetics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aesthetics-report
          path: verification/reports/aesthetics.*

  publication:
    runs-on: ubuntu-latest
    needs: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: engineering
      # Offline: missing source snapshots/reviews BLOCK this job. Do not use
      # continue-on-error, pull_request_target, implicit main fetches or auto-approval.
      # Provision the reviewed evidence cache in the checkout before enabling Pages.
      - run: npm run verify:science
      - name: Preserve every scientific finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-report
          path: verification/reports/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [engineering, publication]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
