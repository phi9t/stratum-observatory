name: STRATUM verified publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: stratum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Install test browser
        run: uv run --frozen playwright install --with-deps chromium
      - run: npm run verify:engineering
      # A locally produced receipt asserts every field it is judged on. Attesting the exact
      # tested artifact is what makes the receipt evidence rather than a claim about itself.
      - name: Attest the tested artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/index.html
      - name: Record the attestation in the receipt
        run: |
          uv run --frozen python - <<'PY'
          import hashlib, json, os, pathlib
          receipt = pathlib.Path('verification/reports/engineering.json')
          data = json.loads(receipt.read_text())
          data['provenance'] = {
              'artifact_sha256': hashlib.sha256(pathlib.Path('dist/index.html').read_bytes()).hexdigest(),
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
          }
          receipt.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Retain exact tested artifact and receipt
        uses: actions/upload-artifact@v4
        with:
          name: engineering
          path: |
            dist/index.html
            verification/reports/
            tests/browser-results.json
  schematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      # Diagram semantics against core.mjs over the full 504-layer matrix. No browser.
      - run: npm run verify:schematics
      - name: Preserve the schematics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schematics-report
          path: verification/reports/schematics.*

  aesthetics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: npm run build
      # Measured legibility, type and spacing scales, layout composition and visual drift.
      # Green as of the token retune. Fix the stylesheet, never the policy: policy.json is
      # inside toolchain_digest precisely so loosening a threshold cannot pass unnoticed.
      - run: npm run verify:aesthetics
      - name: Preserve the aesthetics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aesthetics-report
          path: verification/reports/aesthetics.*

  presentations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: npm run build
      # Exports, delivered-page accessibility, print, portability and preview freshness,
      # loaded from a real file:// origin rather than injected with set_content().
      - run: npm run verify:presentations
      - name: Preserve the presentations report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentations-report
          path: verification/reports/presentations.*

  publication:
    runs-on: ubuntu-latest
    needs: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: engineering
      # Offline: missing source snapshots/reviews BLOCK this job. Do not use
      # continue-on-error, pull_request_target, implicit main fetches or auto-approval.
      # Provision the reviewed evidence cache in the checkout before enabling Pages.
      - run: npm run verify:science
      - name: Preserve every scientific finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-report
          path: verification/reports/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [engineering, schematics, aesthetics, presentations, publication]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
