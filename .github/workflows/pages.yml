name: STRATUM verified publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: stratum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Install test browser
        run: uv run --frozen playwright install --with-deps chromium
      - run: npm run verify:engineering
      # A locally produced receipt asserts every field it is judged on. Attesting the exact
      # tested artifact is what makes the receipt evidence rather than a claim about itself.
      # Build provenance is unavailable for user-owned PRIVATE repositories, so this step is
      # skipped there rather than failing the run. Skipping it is not a waiver: without an
      # attestation the receipt is self-produced, and `verification/runner.py` already reports
      # RECEIPT_UNATTESTED BLOCKED for exactly that. The gate tells the truth either way -- what
      # changes is whether that particular finding can ever be cleared, not whether it is hidden.
      - name: Attest the tested artifact
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.html
      - name: Record the attestation in the receipt
        if: ${{ !github.event.repository.private }}
        run: |
          uv run --frozen python - <<'PY'
          import hashlib, json, os, pathlib
          receipt = pathlib.Path('verification/reports/engineering.json')
          data = json.loads(receipt.read_text())
          data['provenance'] = {
              'artifact_sha256': hashlib.sha256(pathlib.Path('dist/index.html').read_bytes()).hexdigest(),
              'artifacts': data['artifacts'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
          }
          receipt.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Retain exact tested artifact and receipt
        uses: actions/upload-artifact@v4
        with:
          name: engineering
          path: |
            dist/*.html
            verification/reports/
            tests/browser-results.json
  schematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      # Diagram semantics against core.mjs over the full 544-layer matrix. No browser.
      - run: npm run verify:schematics
      - name: Preserve the schematics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schematics-report
          path: verification/reports/schematics.*

  aesthetics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: npm run build
      # Measured legibility, type and spacing scales, layout composition and visual drift.
      # Green as of the token retune. Fix the stylesheet, never the policy: policy.json is
      # inside toolchain_digest precisely so loosening a threshold cannot pass unnoticed.
      - run: npm run verify:aesthetics
      - name: Preserve the aesthetics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aesthetics-report
          path: verification/reports/aesthetics.*

  presentations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: npm run build
      # Exports, delivered-page accessibility, print, portability and preview freshness,
      # loaded from a real file:// origin rather than injected with set_content().
      - run: npm run verify:presentations
      - name: Preserve the presentations report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentations-report
          path: verification/reports/presentations.*

  # Publication has two halves, and only one of them can honestly run here.
  #
  # COMPLETENESS -- is every claim backed by cached upstream bytes and an independent signed
  # review? -- is offline by construction. `.verification-cache/` is git-ignored because all 68
  # source licences forbid redistributing the bytes, so CI would report `verified_sources: 0`;
  # and no reviewer identity exists, because inventing one is forbidden. A CI job asking that
  # question can only ever be red, and a check that can never pass is noise a reader stops
  # reading. So that half runs on a trusted machine (`npm run verify:science`, exit 2 BLOCKED),
  # its report is committed to `verification/reports/publication.json`, `VERIFICATION.md` states
  # its figures, and `test_reported_numbers.py` -- which runs inside the *green* engineering gate
  # -- fails if the record drifts from the report or the report was generated on other bytes.
  # BLOCKED is enforced by a check that can pass, instead of announced by one that never can.
  #
  # CONTRADICTIONS -- does any claim disagree with the evidence it cites? -- runs here, on CI's
  # own bytes, and can genuinely pass. It is the half worth gating a pull request on.
  #
  # This is NOT continue-on-error, and it is stricter than one: exit 1 fails the job; a report
  # that is missing, malformed, or carries no findings fails the job; a FAIL finding fails the
  # job whatever the exit code says. Only exit 2 is accepted -- BLOCKED, which this project does
  # not treat as failing -- and only after the report has been checked for substance.
  publication-contradictions:
    runs-on: ubuntu-latest
    needs: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Provision the pinned interpreter and locked dependencies
        run: |
          uv python install
          uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: engineering
      - name: Run the publication audit and gate on contradictions only
        run: |
          set +e
          npm run verify:science 2>&1 | tee /tmp/science.log
          code=${PIPESTATUS[0]}
          set -e
          SCIENCE_EXIT=$code python3 - <<'PY'
          import json,os,sys
          code=int(os.environ['SCIENCE_EXIT'])
          try:
              report=json.load(open('verification/reports/publication.json'))
          except Exception as e:
              print(f'no readable publication report: {e}',file=sys.stderr);sys.exit(1)
          findings=report.get('findings') or []
          fails=[f for f in findings if f.get('status')=='FAIL']
          counts={}
          for f in findings: counts[f.get('status')]=counts.get(f.get('status'),0)+1
          verdict=('FAIL' if fails or code==1 else 'EMPTY' if not findings else
                   'PASS' if code==0 else 'BLOCKED' if code==2 else f'EXIT {code}')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Publication audit — contradictions gate\n\n')
              out.write(f'`{len(findings)}` findings: '+', '.join(f'{k} {v}' for k,v in sorted(counts.items()))+f'; gate exit {code}\n\n')
              if verdict=='FAIL':
                  out.write(f'**{len(fails)} FAIL — a claim is contradicted by its own evidence. This must be fixed.**\n\n')
                  for f in fails[:20]: out.write(f"- `{f.get('code')}` {f.get('subject')}: {f.get('message')}\n")
              elif verdict=='EMPTY':
                  out.write('**The audit produced no findings. That is not a pass.**\n')
              elif verdict=='BLOCKED':
                  out.write('**No contradictions.** Every non-PASS finding is BLOCKED: missing evidence, '
                            'not a disagreement with evidence.\n\n'
                            'Completeness is an offline gate. CI holds no upstream source bytes '
                            '(`.verification-cache/` is git-ignored; the licences forbid vendoring) '
                            'and no reviewer identity (inventing one is forbidden), so this run '
                            'reports more BLOCKED than a trusted machine does. The authoritative '
                            'completeness figures are the committed '
                            '`verification/reports/publication.json`, stated in `VERIFICATION.md` '
                            'and pinned to the current bytes by the engineering gate.\n')
              else:
                  out.write(f'**{verdict}.**\n')
          print(f'verdict {verdict}: {counts}')
          sys.exit(0 if verdict in ('PASS','BLOCKED') else 1 if verdict=='FAIL' else 2)
          PY
      - name: Preserve every finding from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-report
          path: verification/reports/

  # The deliverable is the artifact the four software gates verified. It is packaged in its own
  # job so that packaging never depends on, nor is entangled with, the scientific audit.
  package:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engineering
      # The schematics subtree is self-contained and its gates run locally (npm run check);
      # Stratum's gates do not cover it. Here it is only built and shipped under schematics/.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the model schematics
        working-directory: schematics
        run: |
          npm ci
          npm run index
      - run: cp -r schematics/dist dist/schematics
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Gated on a repository variable because GitHub Pages is unavailable for private
    # repositories on the Free plan: without this, deploy fails on a repo that simply cannot
    # serve a page, turning a plan limitation into a red build. Set PAGES_ENABLED=true
    # (`gh variable set PAGES_ENABLED --body true`) once Pages is available for this repository.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    # AMENDED CONTRACT, deliberately and on the record. Deployment previously required the
    # publication gate, which is BLOCKED and will stay BLOCKED until an independent reviewer
    # signs -- so the page could never ship. It now requires the four gates that measure the
    # software itself. The publication job still runs on every push and still reports BLOCKED;
    # the page states its own scientific status rather than being withheld. Nothing is
    # continue-on-error: each of these four must genuinely pass.
    needs: [engineering, schematics, aesthetics, presentations, package]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
