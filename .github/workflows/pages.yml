name: STRATUM verified publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stratum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - run: npm run verify:engineering
      - name: Retain exact tested artifact and receipt
        uses: actions/upload-artifact@v4
        with:
          name: engineering
          path: |
            dist/index.html
            verification/reports/
            tests/browser-results.json
  publication:
    runs-on: ubuntu-latest
    needs: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: engineering
      # Offline: missing source snapshots/reviews BLOCK this job. Do not use
      # continue-on-error, pull_request_target, implicit main fetches or auto-approval.
      # Provision the reviewed evidence cache in the checkout before enabling Pages.
      - run: npm run verify:science
      - name: Preserve every scientific finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-report
          path: verification/reports/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [engineering, publication]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
